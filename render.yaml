services:
  - type: web
    name: smartfinancial-ai
    env: node
    plan: free
    buildCommand: |
      npm install
      cd client && npm install && npm run build
      cd .. && npm install
    startCommand: node server/production.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWELVE_API_KEY
        sync: false
      - key: PORT
        value: 10000
